<svg xmlns="http://www.w3.org/2000/svg" width="777" height="649" viewBox="0 0 777 649">
<rect width="777" height="649" rx="10" fill="#1f2329"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="388.5" y="22" fill="#8a919c" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle">char_classify_demo</text>
<g font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#d8dee9" xml:space="preserve">
<text x="18.0" y="56" >char-classify demo</text>
<text x="18.0" y="94" font-weight="bold">── each is_* is a masked table lookup (note: returns int, not bool) ──</text>
<text x="18.0" y="113" >  char  digit alpha upper space hex</text>
<text x="18.0" y="132" >   7     1     0     0     0    1</text>
<text x="18.0" y="151" >   .     0     0     0     1    0</text>
<text x="18.0" y="170" >   a     0     1     0     0    1</text>
<text x="18.0" y="189" >   Z     0     1     1     0    0</text>
<text x="18.0" y="208" >   _     0     0     0     0    0</text>
<text x="18.0" y="227" >   x     0     1     0     0    0</text>
<text x="18.0" y="265" font-weight="bold">── static_assert: the classification ran in the compiler ──</text>
<text x="18.0" y="284" >  digit/alpha/upper and tolower/toupper all held at compile time</text>
<text x="18.0" y="322" font-weight="bold">── hexdigit() nibbles and hexdec() bytes (constexpr-clean) ──</text>
<text x="18.0" y="341" >  hexdec(&quot;ff&quot;) = 255, hexdec(&quot;1b&quot;) = 27, hexdec(&quot;gg&quot;) = -1  (all folded at compile time)</text>
<text x="18.0" y="379" font-weight="bold">── a scan that leans on the predicates ──</text>
<text x="18.0" y="398" >  input: &quot;x42 = ab + 7;&quot;</text>
<text x="18.0" y="417" >    word   &quot;x42&quot;</text>
<text x="18.0" y="436" >    space  [1 space(s)]</text>
<text x="18.0" y="455" >    other  &quot;=&quot;</text>
<text x="18.0" y="474" >    space  [1 space(s)]</text>
<text x="18.0" y="493" >    word   &quot;ab&quot;</text>
<text x="18.0" y="512" >    space  [1 space(s)]</text>
<text x="18.0" y="531" >    other  &quot;+&quot;</text>
<text x="18.0" y="550" >    space  [1 space(s)]</text>
<text x="18.0" y="569" >    number &quot;7&quot;</text>
<text x="18.0" y="588" >    other  &quot;;&quot;</text>
<text x="18.0" y="626" >done.</text>
</g></svg>
